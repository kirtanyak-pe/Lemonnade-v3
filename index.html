<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#161616" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap" rel="stylesheet" />
    <title>L3 Design System · Lemonnade V3</title>
    <!-- Plain-text docs for AI agents (this site renders with JavaScript). -->
    <link rel="alternate" type="text/plain" href="llms.txt" title="L3 design system docs for AI agents" />
    <script>
      // Apply the stored L3 theme before first paint (mirrors src/theme/ThemeProvider.tsx).
      (function () {
        var s = {};
        try { s = JSON.parse(localStorage.getItem('l3-theme') || '{}') } catch (e) {}
        var p = ['lm', 'cspro', 'kuber'].indexOf(s.product) >= 0 ? s.product : 'lm';
        var m = s.mode === 'light' || s.mode === 'dark' ? s.mode
          : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        if (p === 'cspro') m = 'dark';
        document.documentElement.dataset.product = p;
        document.documentElement.dataset.mode = m;
        // No saved choice → follow the OS 'Increase contrast' setting.
        var c = s.contrast === 'accessible' || (s.contrast === 'default' && s.v === 2) ? s.contrast
          : matchMedia('(prefers-contrast: more)').matches ? 'accessible' : 'default';
        if (c === 'accessible') document.documentElement.dataset.contrast = 'accessible';
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <!-- Replaced by the app on load; tools that don't run JavaScript read this instead. -->
      <p>Lemonnade V3 (L3) design system docs. AI agents and tools that can't run JavaScript: read <a href="llms.txt">llms.txt</a> (index) or <a href="llms-full.txt">llms-full.txt</a> (everything in one file).</p>
    </div>
    <noscript>This site needs JavaScript. Plain-text docs: <a href="llms.txt">llms.txt</a></noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
